<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>XemAi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=0.6.6">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Chats">☰</button>
      <div class="brand-wrap">
        <div id="brand" class="brand"><span class="brand-xem">Xem</span><span class="brand-ai">Ai</span></div>
        <div id="versionBadge" class="version-badge">v0.6.6</div>
        <div id="status" class="status">Connecting…</div>
      </div>
      <button id="moreBtn" class="icon-btn" aria-label="More">⋯</button>
    </header>

    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <div class="drawer-title"><span class="brand-xem">Xem</span><span class="brand-ai">Ai</span></div>
        <button id="closeDrawerBtn" class="icon-btn" aria-label="Close">×</button>
      </div>
      <button id="drawerNewBtn" class="new-chat">＋ New chat</button>
      <div class="drawer-section-label">Recent Chats</div>
      <div id="chatList" class="chat-list"></div>
      <div class="drawer-bottom">
        <button id="capabilitiesBtn" class="drawer-action">Capabilities</button>
        <button id="updateBtn" class="drawer-action">Update XemAi</button>
        <button id="feedbackBtn" class="drawer-action">Rate this chat</button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <section id="messages" class="messages"></section>
      <div id="thinking" class="thinking hidden">XemAi is thinking…</div>

      <form id="composer" class="composer">
        <button id="newBtn" type="button" class="composer-plus" aria-label="New chat">＋</button>
        <textarea id="input" rows="1" maxlength="50000" placeholder="Message XemAi..." autocomplete="off"></textarea>
        <button id="sendBtn" type="submit" class="send-btn">➤</button>
      </form>
      <div class="safe-pad"></div>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </dialog>

  <script src="/app.js?v=0.6.6" defer></script>
</body>
</html>

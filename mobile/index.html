<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>XemAi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css?v=0.9.15">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Chats">☰</button>
      <div class="brand-wrap">
        <div id="brand" class="brand"><span class="brand-xem">Xem</span><span class="brand-ai">Ai</span></div>
        <div id="versionBadge" class="version-badge">v0.9.15</div>
        <div id="computeBadge" class="compute-badge">Compute: checking…</div>
        <div id="status" class="status">Connecting…</div>
      </div>
      <button id="moreBtn" class="icon-btn" aria-label="Chat options" aria-haspopup="dialog" aria-controls="modal" aria-expanded="false">⋯</button>
    </header>

    <aside id="drawer" class="drawer">
      <div class="drawer-head">
        <div class="drawer-title"><span class="brand-xem">Xem</span><span class="brand-ai">Ai</span></div>
        <button id="closeDrawerBtn" class="icon-btn" aria-label="Close">×</button>
      </div>
      <button id="drawerNewBtn" class="new-chat">＋ New chat</button>
      <div class="drawer-section-label">Recent Chats</div>
      <div id="chatList" class="chat-list"></div>
      <div class="drawer-bottom">
        <button id="skyrimBtn" class="drawer-action" aria-label="Skyrim tools"><span>Skyrim tools</span><span id="visionSidebarIndicator" class="vision-sidebar-indicator" data-state="unchecked" role="status" aria-live="polite" aria-label="Visual analysis status" title="Visual analysis status has not been checked">○</span></button>
        <button id="feedbackBtn" class="drawer-action">Rate this chat</button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <section id="messages" class="messages"></section>
      <div id="thinking" class="thinking hidden" role="status" aria-live="polite"><span class="thinking-label">XemAi is thinking</span><span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>

      <div id="attachmentTray" class="attachment-tray hidden"></div>
      <input id="galleryInput" type="file" accept="image/*" multiple hidden>
      <input id="cameraPhotoInput" type="file" accept="image/*" capture="environment" hidden>
      <input id="cameraVideoInput" type="file" accept="video/*" capture="environment" hidden>
      <input id="fileInput" type="file" multiple hidden>

      <div id="attachmentMenuScrim" class="attachment-menu-scrim hidden"></div>
      <section id="attachmentMenu" class="attachment-menu hidden" aria-label="Add attachment">
        <div class="attachment-menu-handle"></div>
        <button id="galleryBtn" type="button" class="attachment-menu-item">
          <span class="attachment-menu-icon">▣</span>
          <span>Photo Gallery</span>
        </button>
        <button id="cameraPhotoBtn" type="button" class="attachment-menu-item">
          <span class="attachment-menu-icon">◉</span>
          <span>Take Photo</span>
        </button>
        <button id="cameraVideoBtn" type="button" class="attachment-menu-item">
          <span class="attachment-menu-icon">▶</span>
          <span>Record Video</span>
        </button>
        <button id="filesBtn" type="button" class="attachment-menu-item">
          <span class="attachment-menu-icon">⌑</span>
          <span>Files</span>
        </button>
        <button id="attachmentMenuCancel" type="button" class="attachment-menu-cancel">Cancel</button>
      </section>

      <form id="composer" class="composer">
        <button id="newBtn" type="button" class="composer-plus" aria-label="Attach file">＋</button>
        <textarea id="input" rows="1" maxlength="50000" placeholder="Message XemAi..." autocomplete="off"></textarea>
        <button id="sendBtn" type="submit" class="send-btn" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
      <div class="safe-pad"></div>
    </main>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalActions" class="modal-actions"></div>
  </dialog>

  <script src="/media.js?v=0.9.15" defer></script>
  <script src="/notifications.js?v=0.9.15" defer></script>
  <script src="/app.js?v=0.9.15" defer></script>
</body>
</html>

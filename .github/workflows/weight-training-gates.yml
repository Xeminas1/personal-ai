name: XemAi offline weight-training safety gates
on:
  pull_request:
    paths:
      - "training/**"
      - "test_weight_training.py"
      - "test_training_pc_preflight.py"
      - "test_training_windows_setup.py"
      - "test_training_model_download.py"
      - "test_synthetic_smoke.py"
      - "test_training_failure_diagnostics.py"
      - "test_training_adapter_evaluation.py"
      - ".github/workflows/weight-training-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile offline training utilities
        run: python -m compileall -q training test_weight_training.py test_training_pc_preflight.py test_training_windows_setup.py test_training_model_download.py test_synthetic_smoke.py test_training_failure_diagnostics.py test_training_adapter_evaluation.py
      - name: Test dataset consent, privacy and execution guards (no GPU or model downloads)
        run: python -m unittest -v test_weight_training test_training_pc_preflight test_training_windows_setup test_training_model_download test_synthetic_smoke test_training_failure_diagnostics test_training_adapter_evaluation
      - name: Run unchanged app self tests
        run: python self_test.py
      - name: Check pinned release manifest (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: python verify_release_manifest.py

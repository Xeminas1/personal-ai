name: XemAi updater and reply HTTP reliability regressions
on:
  pull_request:
    paths:
      - ".github/workflows/reliability-regressions.yml"
      - "app/mobile_server.py"
      - "app/updater.py"
      - "test_auto_updates.py"
      - "test_reply_http.py"
      - "test_chat_delete.py"
      - "mobile/**"
      - "test_notifications_browser.py"
      - "app/worker_server.py"
      - "app/restart_supervisor.py"
      - "app/weight_training.py"
      - "test_worker_self_update.py"
  workflow_dispatch:

jobs:
  reliability-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run previously untracked updater and reply HTTP tests
        run: python -m unittest -v test_auto_updates test_reply_http test_worker_self_update

  reply-sound-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Reply sound plays at an audible level in real Chromium WebAudio
        run: python test_notifications_browser.py

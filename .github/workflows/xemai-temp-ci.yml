name: XemAi temporary validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile project
        run: python -m compileall -q -f .
      - name: Run XemAi self-test
        run: python self_test.py

name: XemAi Developer Mode regression tests
on:
  pull_request:
    paths:
      - "app/**"
      - "developer_setup.py"
      - "test_developer_projects.py"
      - "test_developer_guidance.py"
      - "test_developer_multifile.py"
      - "test_developer_trace.py"
      - "test_visual_routing.py"
      - "test_media_support.py"
      - "test_vision_worker.py"
      - "app/version.py"
      - "self_test.py"
      - "test_updater.py"
      - ".github/workflows/developer-mode-tests.yml"
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q app developer_setup.py test_developer_projects.py test_developer_guidance.py test_developer_multifile.py test_developer_trace.py test_visual_routing.py
      - name: Run developer-mode security tests
        run: python test_developer_projects.py
      - name: Test developer source retrieval
        run: python test_developer_guidance.py
      - name: Test multi-file read-only investigations
        run: python test_developer_multifile.py
      - name: Test read-only source tracing
        run: python test_developer_trace.py
      - name: Test image-only visual routing
        run: python test_visual_routing.py
      - name: Test existing image attachment and vision worker features
        run: |
          python test_media_support.py
          python test_vision_worker.py
      - name: Run XemAi built-in test suite
        run: python self_test.py
      - name: Run update validation tests
        run: python test_updater.py

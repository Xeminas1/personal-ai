name: XemAi Developer Mode regression tests
on:
  pull_request:
    paths:
      - "app/**"
      - "developer_setup.py"
      - "test_developer_projects.py"
      - "test_developer_guidance.py"
      - "test_developer_multifile.py"
      - "test_developer_trace.py"
      - "test_visual_routing.py"
      - "test_governance_reporting.py"
      - "test_agent_team.py"
      - "test_ai_watch.py"
      - "test_watch_intelligence.py"
      - "test_capability_inventory.py"
      - "test_dialogue_mission.py"
      - "test_self_knowledge.py"
      - "test_media_support.py"
      - "test_vision_worker.py"
      - "app/version.py"
      - "self_test.py"
      - "test_updater.py"
      - "test_update_performance.py"
      - "test_attachment_challenges.py"
      - "test_github_bridge.py"
      - "github_bridge_setup.py"
      - "bridge_setup.bat"
      - "test_drag_drop.js"
      - "mobile/index.html"
      - "mobile/app.js"
      - "mobile/styles.css"
      - "mobile/sw.js"
      - "app/attachment_tasks.py"
      - "app/gui_backend.py"
      - ".github/workflows/developer-mode-tests.yml"
  workflow_dispatch:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q app developer_setup.py test_developer_projects.py test_developer_guidance.py test_developer_multifile.py test_developer_trace.py test_visual_routing.py test_governance_reporting.py test_agent_team.py test_ai_watch.py test_dialogue_mission.py test_capability_inventory.py test_attachment_challenges.py test_self_knowledge.py
      - name: Run developer-mode security tests
        run: python test_developer_projects.py
      - name: Test developer source retrieval
        run: python test_developer_guidance.py
      - name: Test multi-file read-only investigations
        run: python test_developer_multifile.py
      - name: Test read-only source tracing
        run: python test_developer_trace.py
      - name: Test image-only visual routing
        run: python test_visual_routing.py
      - name: Test existing image attachment and vision worker features
        run: |
          python test_media_support.py
          python test_vision_worker.py
      - name: Test truthful runtime self-reporting
        run: |
          python test_self_knowledge.py
          python test_governance_reporting.py
      - name: Test supervised read-only agent team
        run: python test_agent_team.py
      - name: Test opt-in AI Technology Watch
        run: python test_ai_watch.py
      - name: Test development mission and hypothetical dialogue
        run: python test_dialogue_mission.py
      - name: Test authoritative inventory and self audit regression
        run: python test_capability_inventory.py
      - name: Test explicit-approval private GitHub bridge
        run: python test_github_bridge.py
      - name: Test attached Skyrim source challenges
        run: python test_attachment_challenges.py
      - name: Test Qwen3.5 9B Q8 worker selection and fallback
        run: python test_worker_latency.py
      - name: Validate browser JavaScript and drag-drop interactions
        run: |
          node --check mobile/app.js
          node test_drag_drop.js
      - name: Run XemAi built-in test suite
        run: python self_test.py
      - name: Test AI Watch follow-ups and restart health
        run: python test_watch_intelligence.py
      - name: Run update validation tests
        run: |
          python test_updater.py
          python test_update_performance.py
